version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest"]
      typescript:
        patterns: ["typescript", "@typescript-eslint/*", "typescript-eslint"]
      eslint:
        patterns: ["eslint", "@eslint/js", "eslint-plugin-*", "globals", "prettier"]
      testing:
        patterns: ["@testing-library/*", "c8", "jsdom"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
